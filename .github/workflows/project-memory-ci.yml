name: Project memory

on:
  push:
    paths:
      - 'skills/上下文管理/**'
      - '.github/workflows/project-memory-ci.yml'
  pull_request:
    paths:
      - 'skills/上下文管理/**'
      - '.github/workflows/project-memory-ci.yml'

permissions:
  contents: read

jobs:
  project-memory:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and isolated CLI tests
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s "skills/上下文管理/project-three-layer-memory/tests" -v
